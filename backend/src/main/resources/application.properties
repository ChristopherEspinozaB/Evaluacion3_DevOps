### 1.3 — Crear `GlobalExceptionHandler.java` para devolver HTTP 503 si cae MySQL
En `backend/src/main/java/cl/supletanes/supletanes_app/exception/GlobalExceptionHandler.java`, crea este manejador para que CloudWatch registre errores 5XX (`HTTPCode_Target_5XX_Count`) y dispare la alarma cuando falle la base de datos:
```java
package cl.supletanes.supletanes_app.exception;

import org.springframework.dao.DataAccessException;
import org.springframework.http.HttpStatus;
import org.springframework.http.ResponseEntity;
import org.springframework.transaction.CannotCreateTransactionException;
import org.springframework.web.bind.annotation.ExceptionHandler;
import org.springframework.web.bind.annotation.RestControllerAdvice;

import java.time.Instant;
import java.util.Map;

@RestControllerAdvice
public class GlobalExceptionHandler {

    @ExceptionHandler({CannotCreateTransactionException.class, DataAccessException.class})
    public ResponseEntity> handleDatabaseDown(Exception ex) {
        return ResponseEntity.status(HttpStatus.SERVICE_UNAVAILABLE).body(Map.of(
            "status", 503,
            "message", "Base de datos no disponible",
            "timestamp", Instant.now().toString()
        ));
    }
}
```[cite: 16, 24]

### 1.4 — Actualizar `backend/Dockerfile` (Usuario no root + `curl`)
Reemplaza `backend/Dockerfile` para cumplir con estándares de seguridad de contenedores (`UID 10001`) e incluir `curl` para el `healthCheck` de ECS:
```dockerfile
FROM maven:3.9-eclipse-temurin-17 AS build
WORKDIR /app
COPY pom.xml .
RUN mvn dependency:go-offline -B
COPY src ./src
RUN mvn clean package -DskipTests -B

FROM eclipse-temurin:17-jre-jammy
RUN apt-get update && apt-get install -y --no-install-recommends curl \
    && rm -rf /var/lib/apt/lists/* \
    && groupadd -g 10001 appgroup \
    && useradd -u 10001 -g appgroup -s /bin/sh appuser
WORKDIR /app
COPY --from=build /app/target/*.jar app.jar
RUN chown -R appuser:appgroup /app
USER appuser
EXPOSE 8080
ENTRYPOINT ["java", "-XX:MaxRAMPercentage=75.0", "-jar", "app.jar"]
```[cite: 16]

