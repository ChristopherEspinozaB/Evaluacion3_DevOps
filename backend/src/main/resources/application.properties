Crea la carpeta `infra/ecs/` en la raíz de `Evaluacion2_DevOps-main/` y guarda dentro estos **8 archivos**:

### 2.1 — `infra/ecs/td-mysql.tpl.json`
```json
{
  "family": "supletanes-mysql",
  "networkMode": "awsvpc",
  "requiresCompatibilities": ["FARGATE"],
  "cpu": "512",
  "memory": "1024",
  "executionRoleArn": "${LAB_ROLE_ARN}",
  "taskRoleArn": "${LAB_ROLE_ARN}",
  "containerDefinitions": [
    {
      "name": "mysql",
      "image": "mysql:8.0",
      "essential": true,
      "portMappings": [
        { "name": "mysql-port", "containerPort": 3306, "protocol": "tcp" }
