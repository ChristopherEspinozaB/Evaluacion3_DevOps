spring.application.name=supletanes-app

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/supletanes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
